openapi: 3.1.0
info:
  title: curricula.live API
  version: 0.1.0
  description: Read-only catalog contract. Knowledge endpoints return 503 until an RDF publication is connected.
servers:
  - url: /
paths:
  /:
    get:
      operationId: legacyDiscovery
      responses:
        '200': { description: Legacy service discovery document }
  /health/:
    get:
      operationId: legacyHealth
      responses:
        '200': { description: Legacy process health response }
  /v1/concepts/:
    get:
      operationId: listLegacyConceptSlugs
      responses:
        '200': { description: Canonical slugs from the active formal-sciences corpus in a results array }
        '503': { description: RDF release unavailable }
  /v1/concepts/{slug}/:
    get:
      operationId: getLegacyConceptSlug
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Canonical slug in the legacy concept wire shape }
        '404': { description: No canonical concept with this slug }
        '503': { description: RDF release unavailable }
  /v1/search/:
    get:
      operationId: searchLegacyConceptSlugs
      description: The concept projection uses formal-sciences canonical slugs. Connection categories require a reviewed relation UUID crosswalk.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 160 } }
        - { name: category, in: query, schema: { type: string, enum: [all, concepts, connections], default: all } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Legacy concepts-only search response }
        '400': { description: Invalid query, category or limit }
        '501': { description: A connection category requires the unavailable legacy UUID crosswalk }
        '503': { description: RDF release unavailable }
  /api/v1/concepts/{slug}/documentation:
    get:
      operationId: conceptDocumentation
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Canonical IRI and recorded SKOS definitions with language tags }
        '404': { description: Unknown canonical concept }
        '503': { description: RDF release unavailable }
  /api/v1/scholarly/sources:
    get:
      operationId: browseRdfCitationSources
      parameters:
        - { name: producer, in: query, schema: { type: string, default: formal-sciences } }
        - $ref: '#/components/parameters/EvidenceOffset'
        - $ref: '#/components/parameters/EvidenceLimit'
        - $ref: '#/components/parameters/EvidencePublication'
      responses:
        '200': { description: Source IRIs and assertion counts with release version, manifest digest and next offset }
        '400': { description: Invalid pagination or publication pin }
        '409': { description: Publication changed since the requested page }
        '503': { description: Evidence unavailable }
  /api/v1/scholarly/assertions:
    get:
      operationId: browseRdfCitationsBySource
      parameters:
        - { name: producer, in: query, schema: { type: string, default: formal-sciences } }
        - { name: source, in: query, required: true, schema: { type: string, format: uri } }
        - $ref: '#/components/parameters/EvidenceOffset'
        - $ref: '#/components/parameters/EvidenceLimit'
        - $ref: '#/components/parameters/EvidencePublication'
      responses:
        '200': { description: Reified citations for the recorded source, including typed object terms }
        '400': { description: Invalid source IRI, pagination or publication pin }
        '409': { description: Publication changed since the requested page }
        '503': { description: Evidence unavailable }
  /api/v1/concepts/{slug}/evidence:
    get:
      operationId: browseRdfConceptEvidence
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/EvidenceOffset'
        - $ref: '#/components/parameters/EvidenceLimit'
        - $ref: '#/components/parameters/EvidencePublication'
      responses:
        '200': { description: Recorded incoming and outgoing citations for the canonical concept }
        '400': { description: Invalid slug, pagination or publication pin }
        '404': { description: Unknown canonical concept }
        '409': { description: Publication changed since the requested page }
        '503': { description: Evidence unavailable }
  /api/v1/planning/plans:
    get:
      operationId: listTeacherPlans
      security: [{planningAccessToken: []}]
      parameters:
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
      responses:
        '200': { description: Up to 100 plans for the verified owner }
        '401': { description: Invalid or missing API access token }
        '403': { description: Planning disabled or scope missing }
    post:
      operationId: createTeacherPlan
      security: [{planningAccessToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanChange' }
      responses:
        '201': { description: Created owner-scoped plan }
        '400': { description: Invalid title or unknown canonical concept }
        '401': { description: Invalid or missing API access token }
        '403': { description: Planning disabled or scope missing }
  /api/v1/planning/plans/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: readTeacherPlan
      security: [{planningAccessToken: []}]
      responses:
        '200': { description: Owner-scoped plan }
        '401': { description: Invalid or missing API access token }
        '403': { description: Planning disabled or scope missing }
        '404': { description: Plan unavailable to the caller }
    put:
      operationId: updateTeacherPlan
      security: [{planningAccessToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/PlanChange'
                - required: [revision]
      responses:
        '200': { description: Updated owner-scoped plan with incremented revision }
        '401': { description: Invalid or missing API access token }
        '403': { description: Planning disabled or scope missing }
        '404': { description: Missing, inaccessible or stale plan }
  /api/v1/status:
    get:
      operationId: getStatus
      responses:
        '200':
          description: API bootstrap status
          content:
            application/json:
              schema:
                type: object
                required: [service, stage, knowledgeAvailable]
                properties:
                  service: { type: string }
                  stage: { type: string }
                  knowledgeAvailable: { type: boolean }
  /api/v1/concepts:
    get:
      operationId: listConcepts
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200': { description: Concepts from the validated RDF store }
        '400': { description: Invalid limit }
        '503': { description: RDF dataset unavailable }
  /api/v1/concepts/{slug}:
    get:
      operationId: getConcept
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Concept }
        '404': { description: No such concept }
        '503': { description: RDF dataset unavailable }
  /api/v1/search:
    get:
      operationId: search
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - name: producer
          in: query
          description: Registered producer ID, or all for a ranked search across active producers. Omission uses formal sciences.
          schema: { type: string }
      responses:
        '200': { description: Search results from the validated RDF store }
        '400': { description: Invalid search query }
        '503': { description: RDF dataset unavailable }
  /api/v1/knowledge/publications:
    get:
      operationId: listActiveProducerPublications
      responses:
        '200': { description: Publication status keyed by registered producer }
  /api/v1/education:
    get:
      operationId: getPublishedEducationContext
      parameters:
        - { name: iri, in: query, required: true, schema: { type: string, format: uri } }
      responses:
        '200': { description: Explicit educational statements and whether an education source is active }
        '404': { description: Unknown canonical concept }
        '503': { description: RDF dataset unavailable }
  /api/v1/knowledge/publication:
    get:
      operationId: getActivePublication
      description: Reports the active pinned RDF publication and named graph counts.
      responses:
        '200': { description: Publication status, including unconfigured state }
  /api/v1/concepts/by-iri:
    get:
      operationId: getCanonicalConceptByIri
      parameters:
        - { $ref: '#/components/parameters/ConceptIri' }
      responses:
        '200': { description: Canonical concept with permanent IRI and preferred label }
        '400': { description: Invalid IRI syntax }
        '404': { description: Canonical IRI not found }
        '503': { description: Validated RDF dataset unavailable }
  /api/v1/concepts/{slug}/relationships:
    get:
      operationId: getRecordedRelationships
      description: Ordered RDF adjacency by graph layer, predicate, subject and object IRI. Offsets apply after filtering.
      parameters:
        - { $ref: '#/components/parameters/ConceptSlug' }
        - { $ref: '#/components/parameters/Graph' }
        - { $ref: '#/components/parameters/Kind' }
        - { $ref: '#/components/parameters/Predicate' }
        - { $ref: '#/components/parameters/Domain' }
        - { $ref: '#/components/parameters/RelationshipOffset' }
        - { $ref: '#/components/parameters/RelationshipLimit' }
      responses:
        '200':
          description: Recorded statements with direction relative to the selected concept
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Relationship' }
        '400': { description: Invalid query }
        '404': { description: Concept not found }
        '503': { description: Validated RDF dataset unavailable }
  /api/v1/concepts/by-iri/relationships:
    get:
      operationId: getRecordedRelationshipsByIri
      description: Ordered RDF adjacency by graph layer, predicate, subject and object IRI. Offsets apply after filtering.
      parameters:
        - { $ref: '#/components/parameters/ConceptIri' }
        - { $ref: '#/components/parameters/Graph' }
        - { $ref: '#/components/parameters/Kind' }
        - { $ref: '#/components/parameters/Predicate' }
        - { $ref: '#/components/parameters/Domain' }
        - { $ref: '#/components/parameters/RelationshipOffset' }
        - { $ref: '#/components/parameters/RelationshipLimit' }
      responses:
        '200':
          description: Recorded statements with direction relative to the selected concept
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Relationship' }
        '400': { description: Invalid query }
        '404': { description: Concept not found }
        '503': { description: Validated RDF dataset unavailable }
  /api/v1/concepts/{slug}/provenance:
    get:
      operationId: getConceptProvenance
      description: Reified statements and evidence witnesses for outgoing, incoming or all assertions.
      parameters:
        - { $ref: '#/components/parameters/ConceptSlug' }
        - { $ref: '#/components/parameters/EvidenceLimit' }
        - { $ref: '#/components/parameters/Direction' }
        - { $ref: '#/components/parameters/Predicate' }
        - { $ref: '#/components/parameters/Adjacent' }
      responses:
        '200':
          description: Assertions ordered by assertion IRI
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Evidence' }
        '400': { description: Invalid query }
        '404': { description: Concept not found }
        '503': { description: Validated RDF dataset unavailable }
  /api/v1/concepts/by-iri/provenance:
    get:
      operationId: getConceptProvenanceByIri
      description: Reified statements and evidence witnesses for outgoing, incoming or all assertions.
      parameters:
        - { $ref: '#/components/parameters/ConceptIri' }
        - { $ref: '#/components/parameters/EvidenceLimit' }
        - { $ref: '#/components/parameters/Direction' }
        - { $ref: '#/components/parameters/Predicate' }
        - { $ref: '#/components/parameters/Adjacent' }
      responses:
        '200':
          description: Assertions ordered by assertion IRI
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Evidence' }
        '400': { description: Invalid query }
        '404': { description: Concept not found }
        '503': { description: Validated RDF dataset unavailable }
  /api/v1/concepts/{slug}/neighborhood:
    get:
      operationId: getRecordedNeighborhood
      description: Bounded breadth-first traversal over recorded facts. Each named-graph statement occurs once.
      parameters:
        - { $ref: '#/components/parameters/ConceptSlug' }
        - { $ref: '#/components/parameters/Depth' }
        - { $ref: '#/components/parameters/Graph' }
        - { $ref: '#/components/parameters/Kind' }
        - { $ref: '#/components/parameters/Predicate' }
        - { $ref: '#/components/parameters/Domain' }
        - { $ref: '#/components/parameters/NeighborhoodLimit' }
      responses:
        '200':
          description: A directed graph with canonical node metadata and truncation status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Neighborhood' }
        '400': { description: Invalid query }
        '404': { description: Concept not found }
        '503': { description: Validated RDF dataset unavailable }
  /api/v1/concepts/by-iri/neighborhood:
    get:
      operationId: getRecordedNeighborhoodByIri
      description: Bounded breadth-first traversal over recorded facts. Each named-graph statement occurs once.
      parameters:
        - { $ref: '#/components/parameters/ConceptIri' }
        - { $ref: '#/components/parameters/Depth' }
        - { $ref: '#/components/parameters/Graph' }
        - { $ref: '#/components/parameters/Kind' }
        - { $ref: '#/components/parameters/Predicate' }
        - { $ref: '#/components/parameters/Domain' }
        - { $ref: '#/components/parameters/NeighborhoodLimit' }
      responses:
        '200':
          description: A directed graph with canonical node metadata and truncation status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Neighborhood' }
        '400': { description: Invalid query }
        '404': { description: Concept not found }
        '503': { description: Validated RDF dataset unavailable }
  /api/v1/relationships/search:
    get:
      operationId: searchRecordedConnections
      description: Searches canonical concept-to-concept statements by endpoint labels, endpoint slugs or predicate name. Exact matches rank first. The source and target preserve recorded RDF direction, and each named graph is reported separately.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 160 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Bounded matching connections from the active RDF publication, ordered by match rank, subject, predicate, object and graph
          content:
            application/json:
              schema:
                type: object
                required: [query, connections]
                properties:
                  query: { type: string }
                  connections:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      required: [subject, predicate, object, graph, subjectSlug, subjectLabel, objectSlug, objectLabel]
                      properties:
                        subject: { type: string, format: uri }
                        predicate: { type: string, format: uri }
                        object: { type: string, format: uri }
                        graph: { type: string, enum: [asserted, inferred, alignments] }
                        subjectSlug: { type: string }
                        subjectLabel: { type: string }
                        objectSlug: { type: string }
                        objectLabel: { type: string }
        '400': { description: Invalid text or limit }
        '503': { description: RDF dataset unavailable or search exceeded its query timeout }
components:
  securitySchemes:
    planningAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 access token from the approved issuer and API audience with curricula.planning scope.
  parameters:
    EvidenceOffset: { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
    EvidenceLimit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    EvidencePublication:
      name: publication
      in: query
      description: Pin the active manifest digest across pagination.
      schema: { type: string, pattern: '^[a-f0-9]{64}$' }
    ConceptSlug:
      name: slug
      in: path
      required: true
      description: Local slug in formal sciences. Use a canonical IRI to address other namespaces.
      schema: { type: string, pattern: '^[a-z0-9][-a-z0-9]*$' }
    ConceptIri:
      name: iri
      in: query
      required: true
      schema: { type: string, format: iri, maxLength: 2048 }
    Graph:
      name: graph
      in: query
      schema: { type: string, enum: [all, asserted, inferred, alignments], default: all }
    Kind:
      name: kind
      in: query
      schema: { type: string, enum: [all, taxonomy, scientific, association, mapping, other], default: all }
    Predicate:
      name: predicate
      in: query
      description: Exact RDF predicate IRI.
      schema: { type: string, format: iri, maxLength: 2048 }
    Domain:
      name: domain
      in: query
      description: Restricts adjacent concepts to a SKOS scheme identified by IRI or local scheme name. The root remains visible.
      schema: { type: string, maxLength: 2048 }
    RelationshipOffset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
    RelationshipLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    NeighborhoodLimit:
      name: limit
      in: query
      description: Maximum recorded edges. Traversal also caps returned nodes at 200.
      schema: { type: integer, minimum: 1, maximum: 1000, default: 1000 }
    Depth:
      name: depth
      in: query
      schema: { type: integer, minimum: 1, maximum: 5, default: 1 }
    EvidenceLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
    Direction:
      name: direction
      in: query
      schema: { type: string, enum: [outgoing, incoming, all], default: outgoing }
    Adjacent:
      name: adjacent
      in: query
      description: IRI of the opposite endpoint of the reified RDF statement.
      schema: { type: string, format: iri, maxLength: 2048 }
  schemas:
    PlanChange:
      type: object
      required: [title, conceptIri]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        conceptIri: {type: string, format: uri, maxLength: 2048}
        revision: {type: integer, minimum: 1}
    Relationship:
      type: object
      required: [subject, predicate, object, graph, direction, kind, objectLabel, graphIri]
      properties:
        subject: { type: string, format: iri }
        predicate: { type: string, format: iri }
        object: { type: string, format: iri }
        graph: { type: string, enum: [asserted, inferred, alignments] }
        direction:
          description: Recorded orientation relative to the focus. For multi-hop edges, the focus is the first incident node visited.
          enum: [outgoing, incoming]
        kind: { type: string, enum: [taxonomy, scientific, association, mapping, other] }
        objectLabel:
          type: string
          description: Preferred label of the adjacent concept, or its IRI when no label is known.
        graphIri: { type: string, format: iri }
    Neighborhood:
      type: object
      required: [root, nodes, edges, depth, truncated, nodeDetails]
      properties:
        root: { type: string, format: iri }
        nodes:
          type: array
          maxItems: 200
          items: { type: string, format: iri }
        edges:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/Relationship' }
        depth: { type: integer, minimum: 1, maximum: 5 }
        truncated: { type: boolean }
        nodeDetails:
          type: array
          description: Metadata for nodes with canonically registered concept IRIs.
          items:
            type: object
            required: [iri, label, slug, domains]
            properties:
              iri: { type: string, format: iri }
              label: { type: string }
              slug:
                type: [string, "null"]
                description: Formal-sciences slug when available.
              domains:
                type: array
                items: { type: string, format: iri }
    Evidence:
      type: object
      required: [assertionIri, predicate, object, source, witness, identifier, subject, graphIri]
      properties:
        assertionIri: { type: string, format: iri }
        predicate: { type: [string, "null"], format: iri }
        object: { type: [string, "null"] }
        source: { type: [string, "null"] }
        witness: { type: [string, "null"] }
        identifier: { type: [string, "null"] }
        subject: { type: [string, "null"], format: iri }
        graphIri: { type: string, format: iri }
