name: Java RDF API CI
on:
  push:
    branches: [main, dev, 'feat/**']
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Download immutable RDF integration fixture
        run: bash scripts/fetch-integration-fixture.sh
      - name: Verify Java and real RDF integration
        env:
          CURRICULA_RDF_FIXTURE: target/ontology-fixture
        run: ./mvnw --batch-mode --no-transfer-progress verify
