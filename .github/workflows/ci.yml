name: Java RDF API CI
on:
  push:
    branches: [main, dev, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Check the pinned Maven installation
        env:
          MVNW_VERBOSE: "true"
        run: ./mvnw --version
      - name: Download immutable RDF integration fixtures
        run: bash scripts/fetch-integration-fixture.sh
      - name: Verify Java and real RDF integration
        env:
          CURRICULA_RDF_FIXTURE: target/ontology-fixture
          CURRICULA_RDF_FIXTURE_050: target/ontology-fixture-0.5.0
          CURRICULA_RDF_FIXTURE_060: target/ontology-fixture-0.6.0
          CURRICULA_RDF_FIXTURE_070: target/ontology-fixture-0.7.0
        run: ./mvnw --batch-mode --no-transfer-progress --errors verify
